name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pte-platform-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate web apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint tenant and vendor apps
        run: |
          pnpm --filter tenant-web lint
          pnpm --filter vendor-web lint

      - name: Build tenant and vendor apps
        run: |
          pnpm --filter tenant-web build
          pnpm --filter vendor-web build

  deploy:
    name: Deploy to Oracle VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          : "${DEPLOY_SSH_PRIVATE_KEY:?DEPLOY_SSH_PRIVATE_KEY secret is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS secret is required}"

          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$RUNNER_TEMP/pte-deploy-key"
          install -m 644 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/pte-deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

          test -s "$RUNNER_TEMP/pte-deploy-key"
          test -s "$HOME/.ssh/known_hosts"

      - name: Deploy on VPS
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$RUNNER_TEMP/pte-deploy-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=8 \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          API_DIR=/home/ubuntu/pte-org/pte-api
          test -d "$API_DIR/.git"
          exec 9>/tmp/pte-platform-production-deploy.lock
          if ! flock -w 1800 9; then
            echo "Deployment stopped: another deployment still holds the VPS lock."
            exit 1
          fi
          test "$(git -C "$API_DIR" branch --show-current)" = "main"
          if [ -n "$(git -C "$API_DIR" status --porcelain)" ]; then
            echo "Deployment stopped: API repository has uncommitted changes."
            git -C "$API_DIR" status --short
            exit 1
          fi
          git -C "$API_DIR" fetch --prune origin main
          git -C "$API_DIR" merge --ff-only FETCH_HEAD
          cd "$API_DIR"
          PTE_DEPLOY_LOCK_HELD=1 bash deploy/production.sh
          REMOTE
